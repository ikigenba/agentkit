name: Close external issues and PRs

# We don't accept public issues or PRs. Anything opened by an account not on the
# whitelist gets a polite comment and is closed immediately.

on:
  issues:
    types: [opened]
  pull_request_target:      # NOT pull_request — fork PRs need the base-repo write token
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Close if author is not whitelisted
        uses: actions/github-script@v7
        with:
          script: |
            const WHITELIST = ['mgreenly'];   // add usernames here

            const isPR = !!context.payload.pull_request;
            const obj  = context.payload.pull_request || context.payload.issue;
            const author = obj.user.login;

            if (WHITELIST.includes(author)) {
              core.info(`${author} is whitelisted; leaving ${isPR ? 'PR' : 'issue'} #${obj.number} open.`);
              return;
            }

            const kind = isPR ? 'pull requests' : 'issues';
            const body = `We don't accept public ${kind}, but you're welcome to fork it.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: obj.number,
              body,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: obj.number,
              state: 'closed',
              state_reason: 'not_planned',
            });
